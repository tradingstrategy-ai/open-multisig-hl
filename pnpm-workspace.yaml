engineStrict: true

# Force 1 week delay before installing new packages (in minutes)
# so we don't get hit with compromised packasges
# minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@sveltejs/adapter-node"
  - "@sveltejs/enhanced-img"
  - "@sveltejs/kit"
  - "@sveltejs/vite-plugin-svelte"
  - devalue
  - prettier-plugin-svelte
  - svelte
  - svelte-check

ignoredBuiltDependencies:
  - "@datadog/native-iast-taint-tracking"
  - "@datadog/native-metrics"
  - "@datadog/pprof"
  - "@reown/appkit"
  - bufferutil
  - keccak
  - utf-8-validate

onlyBuiltDependencies:
  - "@datadog/native-appsec"
  - "@sentry/cli"
  - dd-trace
  - esbuild
  - protobufjs
  - sharp

overrides:
  "@reown/appkit-wallet>zod": ^4.0.5
  abitype>zod: ^4.0.5
  svelte-headless-table>svelte: ^4.0.0 || ^5.0.0
  svelte-keyed>svelte: ^5.37.1
  svelte-render>svelte: ^5.37.1
  svelte-subscribe>svelte: ^5.37.1

allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  keccak: false
  utf-8-validate: false
